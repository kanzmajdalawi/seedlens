<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdikt — Startup Evaluation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 680px; padding: 40px 24px; }
    .logo { font-size: 32px; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
    .logo span { color: #7f77dd; }
    .tagline { color: #888; font-size: 15px; margin-bottom: 40px; }
    textarea { width: 100%; height: 220px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; color: #fff; font-size: 15px; line-height: 1.6; resize: none; outline: none; font-family: inherit; }
    textarea:focus { border-color: #7f77dd; }
    textarea::placeholder { color: #555; }
    button { width: 100%; margin-top: 16px; padding: 16px; background: #7f77dd; border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #6b63c9; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .hint { margin-top: 16px; color: #555; font-size: 13px; text-align: center; }
    .loading { display: none; text-align: center; margin-top: 24px; color: #7f77dd; }
    .dot { display: inline-block; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Ver<span>dikt</span></div>
    <div class="tagline">AI-powered startup evaluation · Pre-seed & Seed</div>
    <textarea id="description" placeholder="Describe your startup. Include: what you're building, who the founders are, target market, any traction or early users, and what problem you're solving..."></textarea>
    <button id="submitBtn" onclick="runEvaluation()">Evaluate Startup</button>
    <div class="hint">Powered by Claude · Built on Sequoia, a16z & Harvard frameworks</div>
    <div class="loading" id="loading">
      <span class="dot">●</span>
      <span class="dot">●</span>
      <span class="dot">●</span>
      <p style="margin-top:12px;font-size:14px">Evaluating your startup...</p>
    </div>
  </div>

  <script>
   async function runEvaluation() {
      const description = document.getElementById('description').value.trim();
      if (!description) { alert('Please enter a startup description.'); return; }

      document.getElementById('submitBtn').disabled = true;
      document.getElementById('loading').style.display = 'block';

      try {
        const response = await fetch('/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description })
        });

        const data = await response.json();
        if (data.error) { alert(data.error); return; }

        localStorage.setItem('verdikt_response', data.response);
        localStorage.setItem('verdikt_description', description);
        window.location.href = '/results';

      } catch (err) {
        alert('Something went wrong. Please try again.');
      } finally {
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('loading').style.display = 'none';
      }
    }
  </script>
</body>
</html>
