<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdikt — Results</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
    .header { padding: 24px 40px; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: #7f77dd; }
    .actions { display: flex; gap: 12px; }
    .btn { padding: 8px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; font-weight: 500; }
    .btn-outline { background: transparent; border: 1px solid #333; color: #aaa; }
    .btn-outline:hover { border-color: #7f77dd; color: #fff; }
    .btn-primary { background: #7f77dd; color: #fff; }
    .btn-primary:hover { background: #6b63c9; }
    .main { display: grid; grid-template-columns: 1fr 380px; gap: 0; min-height: calc(100vh - 73px); }
    .scorecard { padding: 40px; border-right: 1px solid #222; overflow-y: auto; }
    .scorecard pre { white-space: pre-wrap; font-family: inherit; font-size: 14px; line-height: 1.8; color: #ddd; }
    .chat { display: flex; flex-direction: column; height: calc(100vh - 73px); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 100%; }
    .msg-verdikt { background: #1a1a1a; border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.7; color: #ddd; border: 1px solid #2a2a2a; white-space: pre-wrap; }
    .msg-founder { background: #7f77dd22; border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.7; color: #ddd; border: 1px solid #7f77dd44; }
    .msg-label { font-size: 11px; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .chat-input { padding: 20px; border-top: 1px solid #222; display: flex; gap: 12px; }
    .chat-input textarea { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 12px 16px; color: #fff; font-size: 14px; font-family: inherit; resize: none; outline: none; height: 48px; line-height: 1.4; }
    .chat-input textarea:focus { border-color: #7f77dd; }
    .chat-input button { background: #7f77dd; border: none; border-radius: 10px; color: #fff; padding: 0 20px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .chat-input button:hover { background: #6b63c9; }
    .chat-input button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .thinking { color: #555; font-size: 13px; font-style: italic; }
    .section-title { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
    .hint-pills { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 16px; }
    .pill { padding: 6px 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 20px; font-size: 12px; color: #888; cursor: pointer; transition: all 0.2s; }
    .pill:hover { border-color: #7f77dd; color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Ver<span>dikt</span></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="window.location.href='/'">New Evaluation</button>
      <button class="btn btn-outline" onclick="saveReport()">Save Report</button>
      <button class="btn btn-primary" onclick="sendMessage('match me')">Find VCs</button>
    </div>
  </div>

  <div class="main">
    <div class="scorecard">
      <div class="section-title">Evaluation Report</div>
      <pre id="scorecard-content">Loading evaluation...</pre>
    </div>

    <div class="chat">
      <div class="chat-messages" id="chat-messages">
        <div class="msg">
          <div class="msg-label">Verdikt</div>
          <div class="msg-verdikt">Your scorecard is on the left. Ask me anything about the evaluation, push back on my scoring, or type <strong>match me</strong> to find the right VCs for your startup.</div>
        </div>
      </div>

      <div class="hint-pills">
        <div class="pill" onclick="sendMessage('Why did you give that PMF score?')">Challenge PMF score</div>
        <div class="pill" onclick="sendMessage('What is our biggest red flag?')">Biggest red flag</div>
        <div class="pill" onclick="sendMessage('match me')">Find VCs</div>
        <div class="pill" onclick="sendMessage('What should we do next?')">Next steps</div>
      </div>

      <div class="chat-input">
        <textarea id="chat-input" placeholder="Ask Verdikt anything..." onkeydown="handleKey(event)"></textarea>
        <button id="send-btn" onclick="sendFromInput()">Send</button>
      </div>
    </div>
  </div>

  <script>
    window.onload = function() {
      const initialResponse = localStorage.getItem('verdikt_response') || '';
      const scorecard = document.getElementById('scorecard-content');
      if (initialResponse) {
        scorecard.textContent = initialResponse;
      } else {
        scorecard.textContent = 'No evaluation found. Please go back and submit a startup.';
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFromInput(); }
    }

    function sendFromInput() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      sendMessage(msg);
    }

    async function sendMessage(message) {
      addMessage('founder', message);
      const btn = document.getElementById('send-btn');
      btn.disabled = true;

      const thinking = addThinking();

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        thinking.remove();

        if (data.error) {
          addMessage('verdikt', 'Something went wrong. Please try again.');
          return;
        }

        addMessage('verdikt', data.response);

      } catch (err) {
        thinking.remove();
        addMessage('verdikt', 'Connection error. Please try again.');
      } finally {
        btn.disabled = false;
      }
    }

    function addMessage(role, text) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `
        <div class="msg-label">${role === 'founder' ? 'You' : 'Verdikt'}</div>
        <div class="msg-${role}">${text.replace(/\n/g, '<br>')}</div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    function addThinking() {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = '<div class="msg-label">Verdikt</div><div class="msg-verdikt thinking">Thinking...</div>';
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    async function saveReport() {
      const response = await fetch('/save', { method: 'POST' });
      const data = await response.json();
      if (data.report) {
        const blob = new Blob([data.report], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'verdikt-report.txt';
        a.click();
      }
    }
  </script>
</body>
</html>
